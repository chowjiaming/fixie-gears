name: Bug
description: Something in the calculator is wrong
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: Include the search string if the setup matters
      placeholder: https://fixie-gears.netlify.app/?chainring=46&cog=17
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
