name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: true
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Assert PWA emit
        run: |
          test -f dist/client/index.html
          test -f dist/client/manifest.webmanifest
          test -f dist/client/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          sw = Path("dist/client/sw.js").read_text(encoding="utf-8")
          html = Path("dist/client/index.html").read_text(encoding="utf-8")
          if "non-precached-url" in sw:
              raise SystemExit("sw.js is a non-precached-url stub")
          # Precache entry (not only createHandlerBoundToURL("index.html"))
          if not re.search(r'url:\s*"index\.html"', sw):
              raise SystemExit("sw.js precache missing url:\"index.html\"")
          manifest_links = len(re.findall(r'rel=["\']manifest["\']', html))
          if manifest_links != 1:
              raise SystemExit(f'expected one rel="manifest", found {manifest_links}')
          print("PWA emit asserts ok")
          PY
