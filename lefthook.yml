pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css}"
      exclude:
        - pnpm-lock.yaml
        - src/routeTree.gen.ts
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    biome:
      run: pnpm exec biome check --colors=off .
    typecheck:
      run: pnpm run typecheck
